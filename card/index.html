<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Akka – Contact Card</title>
    <meta name="description" content="Save Patrick Akka's contact details (AKKA INC).">
    <style>
        :root {
            --bg: #e5e7eb; --card: #ffffff; --ink: #111827; --muted: #6b7280;
            --brand: #1e3a8a; --brand-2: #1e40af; --line: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b1120; --card: #111827; --ink: #f3f4f6; --muted: #9ca3af; --line: #1f2937; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: var(--bg); color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            width: 100%; max-width: 380px; background: var(--card); border-radius: 20px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }
        .head { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; padding: 32px 24px 28px; text-align: center; }
        .avatar {
            width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center;
            background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); font-size: 30px; font-weight: 700; letter-spacing: 1px;
        }
        h1 { margin: 0; font-size: 24px; }
        .org { margin-top: 4px; opacity: .85; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
        .rows { padding: 8px 0; }
        .row {
            display: flex; align-items: center; gap: 14px; padding: 14px 24px; color: inherit; text-decoration: none;
            border-bottom: 1px solid var(--line);
        }
        .row:last-child { border-bottom: 0; }
        .row:hover { background: rgba(30,64,175,.06); }
        .icon { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(30,64,175,.1); color: var(--brand-2); }
        @media (prefers-color-scheme: dark) { .icon { color: #93c5fd; background: rgba(147,197,253,.12); } }
        .label { font-size: 12px; color: var(--muted); }
        .value { font-size: 16px; font-weight: 500; word-break: break-all; }
        .actions { padding: 8px 24px 24px; }
        .save {
            display: block; width: 100%; text-align: center; padding: 14px; border-radius: 999px; border: 0;
            background: var(--brand-2); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none;
        }
        .save:hover { background: var(--brand); }
        .hint { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <div class="head">
            <div class="avatar">PA</div>
            <h1>Patrick Akka</h1>
            <div class="org">AKKA INC</div>
        </div>

        <div class="rows">
            <a class="row" href="tel:+61420404646">
                <span class="icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </span>
                <span><div class="label">Mobile</div><div class="value">0420 404 646</div></span>
            </a>
            <a class="row" href="mailto:patrickakka99@gmail.com">
                <span class="icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
                </span>
                <span><div class="label">Email</div><div class="value">patrickakka99@gmail.com</div></span>
            </a>
        </div>

        <div class="actions">
            <a class="save" href="patrick-akka.vcf" download="Patrick Akka.vcf">Save Contact</a>
            <p class="hint">Adds Patrick to your phone's contacts</p>
        </div>
    </main>
</body>
</html>
